name: 台股到價提醒

on:
  workflow_dispatch: {}   # 允許手動觸發，也讓外部排程服務(cron-job.org)透過 API 呼叫這個事件來觸發執行

permissions:
  contents: write   # 需要這個權限才能把 state.json 的更新 commit 回 repo

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install yfinance pandas numpy

      - name: 執行股價檢查
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          STOCKS_CSV_URL: ${{ secrets.STOCKS_CSV_URL }}
        run: python stock_alert.py

      - name: 儲存通知狀態
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "更新通知狀態"
            git push
          else
            echo "狀態無變化，不需要 commit。"
          fi
